  # ============================================================================
  # Phase 9: Fix Pipeline
  # ============================================================================

  - id: "9.1"
    description: "Create fix queue manager"
    status: "pending"
    deps:
      - "3.4"
    parallel: false
    context: |
      Manages the queue of errors to fix. In autonomous mode, processes
      errors FIFO. Ensures only one fix runs at a time.
    requirements:
      - Create src/fixer/queue.ts
      - class FixQueue
      - "Method getNext(): Error | null (oldest pending/suggested)"
      - Track fixInProgress flag
      - Method processQueueIfReady() for autonomous mode
    criteria:
      - Returns oldest pending/suggested error
      - Returns null if queue empty or fix in progress
      - processQueueIfReady triggers processing when ready
    files:
      - src/fixer/queue.ts
    context_files:
      - src/fixer/lock.ts

  - id: "9.2"
    description: "Create fix orchestrator"
    status: "pending"
    deps:
      - "9.1"
      - "6.3"
      - "7.1"
      - "7.2"
      - "8.1"
      - "3.4"
    parallel: false
    context: |
      Orchestrates the full fix pipeline: acquire lock, analyze (if needed),
      fix, verify, update status. Handles failures and retries.
    requirements:
      - Create src/fixer/index.ts
      - class FixOrchestrator
      - "Method fixError(errorId, options): Promise<FixResult>"
      - Acquire lock, validate status
      - Run analysis if pending (or --reanalyze)
      - Transition to suggested, store analysis
      - Run fix, transition to fixing
      - Run verification
      - Update status based on result (fixed/pending/failed)
      - Handle phase failures, increment attempts
      - Release lock on completion
    criteria:
      - Full pipeline executes correctly
      - Lock acquired at start, released at end
      - Status transitions are correct
      - Failures increment fix_attempts
      - Max attempts exceeded sets status to failed
    files:
      - src/fixer/index.ts
    context_files:
      - src/fixer/queue.ts
      - src/agents/index.ts
      - src/fixer/context.ts
      - src/fixer/output.ts
      - src/fixer/verifier.ts
      - src/fixer/lock.ts
    risk_notes: |
      The fix orchestrator is the most complex component, coordinating agents,
      locking, status transitions, and verification. Thorough testing with
      mock agents is essential.

  # ============================================================================
