      - "Function generateFixContext(error, analysis, config, attempt): { path,
        content }"
      - "Path format:
        .selfheal/context/{date}-error-{id}-attempt-{attempt}-{phase}.md"
      - Content matches spec format exactly
      - Handle size limit (truncate stack trace, then log context)
      - UTF-8 encoding, replace non-UTF8 chars
    criteria:
