        file: src/utils/process.ts
        line: 97
        comment: "spawnWithTimeout never sends SIGKILL after the grace period:
          child.killed becomes true immediately after SIGTERM, so the guard `if
          (!child.killed)` prevents SIGKILL. This violates the requirement to
          SIGTERM then SIGKILL after 5s. Track process exit instead (e.g., check
          `child.exitCode === null` / `child.signalCode === null` or set a flag
          on close) and always attempt SIGKILL if still running."
  - iteration: 3
