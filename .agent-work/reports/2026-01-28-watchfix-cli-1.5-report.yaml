        comment: "Windows fallback logic for isOurProcess is unreliable:
          spawnSync('wmic', ...) does not throw when wmic is missing or fails;
          it sets result.error/nonzero status. The current try/catch never
          triggers, so PowerShell fallback is skipped and error text can be
          treated as a command line. Check output.error or status and fall back
          to PowerShell when wmic isn't available or returns no command line."
