        comment: "Size-limit enforcement is incomplete: `ensureSizeLimit` only removes
          `before` log lines, so if `cleanup.context_max_size_kb` is smaller
          than the header+error message+stack trace (or if `after` lines
          dominate), the generated content can still exceed the limit. This
          violates the criteria that large content is truncated within the size
          limit. Add logic to further shrink (e.g., truncate stack trace below
          32KB when maxBytes is smaller, and/or trim `after` lines once `before`
          is exhausted) to guarantee `Buffer.byteLength(content) <= maxBytes`."
  - iteration: 2
    approved: false
    feedback:
      - severity: blocking
        file: src/fixer/context.ts
        line: 70
        comment: splitRawLog assumes rawLog contains stack trace lines and skips `after`
          lines by `stackLines.length`. If the raw log omits stack trace lines
          (common), this drops legitimate after-context lines, violating the
          spec’s `context_lines_after`. Compute after lines based solely on
          rawLog (e.g., lines after the error line), not stackTrace length.
      - severity: blocking
        file: src/fixer/context.ts
        line: 284
        comment: Size-limit handling removes `afterLines` once `beforeLines` are
          exhausted. The spec says to truncate only from the beginning of the
          raw log (oldest context first) and insert the truncated-line marker;
          trimming the tail changes the required behavior. Adjust truncation to
          remove only from the start and keep the error line intact.
      - severity: blocking
        file: src/fixer/context.ts
        line: 389
        comment: Fix-phase context is not constrained by `cleanup.context_max_size_kb`.
          The spec states all context files are size-limited, so
          `generateFixContext` should enforce the limit (truncate
          content/analysis as needed) to avoid oversized fix inputs.
  - iteration: 3
    approved: false
    feedback:
      - severity: blocking
        file: src/fixer/context.ts
        line: 359
        comment: When analyze content still exceeds maxBytes, the code further truncates
          the stack trace below 32KB and finally slices the entire markdown
          (lines 359-385). This can cut required sections or even the error
          line, violating the spec’s size-limit procedure and “content matches
          spec format exactly.” Per spec, limit stack trace to 32KB
          (head+tail+marker), then remove oldest raw log lines with the
          truncation marker until within limit; avoid arbitrary slicing of the
          final content.
